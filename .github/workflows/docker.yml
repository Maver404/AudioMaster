# Build the Docker image from the sources and smoke-test it with the hardening of
# compose.yaml (read-only filesystem, no capabilities). On main, publish it for amd64 and
# arm64 as ghcr.io/maver404/audiomaster (:latest and :<commit>), then start it the way a
# server does: only compose.yaml in an empty folder, pulled without logging in.
name: Docker image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The newest Buildx and Compose, as on a freshly installed Docker host.
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker # the engine's own builder: images land in `docker images`, as on a host
      - uses: docker/setup-compose-action@v1
        with:
          version: latest
      - name: Versions
        run: |
          docker version --format 'Engine {{.Server.Version}}'
          docker buildx version
          docker compose version
      - name: Build
        run: docker build -t audiomaster:ci .
      - name: Smoke test
        run: |
          docker run -d --name am -p 8080:8080 --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges audiomaster:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/ -o page.html && break; sleep 1; done
          grep -q '<title>AudioMaster</title>' page.html
          grep -q '__AM_WORKER_URL__' page.html
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/src/main.js)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/index.html)" = 200
          # GET, not HEAD: nginx does not gzip header-only responses
          curl -s -D headers.txt -o /dev/null -H 'Accept-Encoding: gzip' http://127.0.0.1:8080/
          grep -qi '^content-encoding: gzip' headers.txt
          grep -qi '^vary: accept-encoding' headers.txt
          grep -qi '^x-content-type-options: nosniff' headers.txt
          docker exec am wget -q -O /dev/null http://127.0.0.1:8080/
          docker stop am
      - name: Compose from the sources (built through bake, as recent Docker Compose does)
        shell: bash # -eo pipefail: a failed build fails the step even through tee
        env:
          COMPOSE_BAKE: 'true'
          COMPOSE_FILE: compose.yaml:compose.build.yaml
        run: |
          docker compose build 2>&1 | tee compose-build.log
          grep -q 'bake definitions' compose-build.log # the build really went through bake
          docker compose up -d --wait --wait-timeout 120
          curl -fsS http://127.0.0.1:8080/ -o page.html # not piped: grep -q would cut curl off
          grep -q '<title>AudioMaster</title>' page.html
          docker compose down
      - name: Container logs
        if: always()
        env:
          COMPOSE_FILE: compose.yaml:compose.build.yaml
        run: |
          docker logs am || true
          docker compose logs || true

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/setup-compose-action@v1
        with:
          version: latest
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Only COPY runs on the target platform (the page is built on the runner's own), so
      # arm64 needs no emulation.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/maver404/audiomaster:latest
            ghcr.io/maver404/audiomaster:${{ github.sha }}
      - name: Start it as a server does (only compose.yaml, anonymous pull)
        run: |
          docker logout ghcr.io
          mkdir server && cp compose.yaml server/ && cd server
          docker compose pull
          docker compose up -d --wait --wait-timeout 120
          curl -fsS http://127.0.0.1:8080/ -o page.html # not piped: grep -q would cut curl off
          grep -q '<title>AudioMaster</title>' page.html
          docker compose down
