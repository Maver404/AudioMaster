# Only this file is needed: the image is built and published by GitHub Actions.
#   docker compose up -d                          → http://localhost:8080
#   docker compose pull && docker compose up -d   (update to the latest version)
# To build from the sources instead, in a checkout:
#   docker compose -f compose.yaml -f compose.build.yaml up -d
services:
  audiomaster:
    image: ghcr.io/maver404/audiomaster:latest
    ports:
      - "8080:8080"
    restart: unless-stopped
    # Static page only: read-only filesystem (nginx writes just its pid and temp files
    # in /tmp), no capabilities, no privilege escalation.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
