# docker compose up -d   → http://localhost:8080
services:
  audiomaster:
    build: .
    image: audiomaster:latest
    pull_policy: build # every `up` rebuilds from these sources (cached layers), never pulls
    ports:
      - "8080:8080"
    restart: unless-stopped
    # Static page only: read-only filesystem (nginx writes just its pid and temp files
    # in /tmp), no capabilities, no privilege escalation.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
