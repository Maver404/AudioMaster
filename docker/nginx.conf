# One self-contained page (dist/index.html): "/" serves it, every other path is a 404.
server {
    # IPv4 only: an IPv6 listen fails on hosts with IPv6 off, and port mapping does not need it.
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;

    # The page is ~800 KB of inline HTML, CSS and JS: compress it, revalidate it on every
    # visit (ETag), so a new image is picked up at once.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript; # text/html is always included
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = / {
        try_files /index.html =404;
    }

    location = /index.html {
    }

    location / {
        return 404;
    }
}
